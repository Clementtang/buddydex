<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap");

      body {
        width: 1200px;
        height: 630px;
        background: #0d0d0d;
        font-family: "JetBrains Mono", monospace;
        color: #f0e6d3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      .bg-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(218, 119, 86, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(218, 119, 86, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      h1 {
        font-size: 72px;
        font-weight: 700;
        color: #da7756;
        letter-spacing: -0.02em;
      }

      .tagline {
        font-size: 22px;
        color: #8a7d72;
        font-weight: 400;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .buddies {
        display: flex;
        gap: 48px;
        margin-top: 16px;
      }

      .buddy {
        text-align: center;
      }

      .buddy pre {
        font-size: 16px;
        line-height: 1.15;
        color: #f0e6d3;
        white-space: pre;
      }

      .buddy .name {
        font-size: 13px;
        color: #8a7d72;
        margin-top: 6px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      /* Rarity accent colours on buddy names */
      .buddy.common .name {
        color: #b0b0b0;
      }
      .buddy.uncommon .name {
        color: #4ade80;
      }
      .buddy.rare .name {
        color: #60a5fa;
      }
      .buddy.epic .name {
        color: #c084fc;
      }
      .buddy.legendary .name {
        color: #fbbf24;
      }

      .footer-bar {
        position: absolute;
        bottom: 28px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        color: #8a7d72;
      }

      .footer-bar .dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #da7756;
      }

      .species-count {
        font-size: 14px;
        color: #da7756;
        position: absolute;
        top: 28px;
        right: 40px;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="species-count">18 species</div>

    <div class="content">
      <h1>BuddyDex</h1>
      <div class="tagline">A field guide to Claude Buddies</div>

      <div class="buddies">
        <div class="buddy common">
          <pre>
   _
 >(  ·)~~
  (    /
   ~-~      </pre
          >
          <div class="name">Duck</div>
        </div>

        <div class="buddy rare">
          <pre>
  ^   ^
 ( · · )
 (  w  )
  ~~|~~     </pre
          >
          <div class="name">Cat</div>
        </div>

        <div class="buddy legendary">
          <pre>
 v\    /v
 ( ·  · )
 ( \/ )
  -^^^^-    </pre
          >
          <div class="name">Dragon</div>
        </div>

        <div class="buddy epic">
          <pre>
  n_____n
 (  ·  · )
 (  oo   )
  '-----'   </pre
          >
          <div class="name">Capybara</div>
        </div>
      </div>
    </div>

    <div class="footer-bar">
      <span>buddydex.chatbot.tw</span>
      <span class="dot"></span>
      <span>Fan-made encyclopedia</span>
      <span class="dot"></span>
      <span>5 languages</span>
    </div>
  </body>
</html>
