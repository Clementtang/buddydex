<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuddyDex — Claude Buddy Encyclopedia</title>
    <meta
      name="description"
      content="BuddyDex: An encyclopedia of Claude Buddies. Discover, collect, and explore ASCII creatures from the Claude universe."
    />
    <meta property="og:title" content="BuddyDex — Claude Buddy Encyclopedia" />
    <meta
      property="og:description"
      content="Discover, collect, and explore ASCII creatures from the Claude universe."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/detail-controls.css" />
  </head>
  <body>
    <!-- Hatch Overlay — shown when a new buddy is discovered -->
    <div id="hatch-overlay" class="hatch-overlay">
      <div class="hatch-ascii" id="hatch-ascii"></div>
      <p class="hatch-message" id="hatch-message"></p>
    </div>

    <!-- Site Header -->
    <header class="site-header">
      <div class="container">
        <h1>BuddyDex</h1>
        <p class="subtitle">A field guide to Claude Buddies</p>
      </div>
    </header>

    <main>
      <!-- How It Works / Mechanics -->
      <section id="mechanics">
        <div class="container">
          <div class="mechanics-grid" id="mechanics-grid">
            <!-- JS populates mechanic cards here -->
          </div>
        </div>
      </section>

      <!-- Species Collection -->
      <section id="collection">
        <div class="container">
          <div class="rarity-filter" id="rarity-filter">
            <!-- JS populates filter buttons here -->
          </div>
          <div class="species-grid" id="species-grid">
            <!-- JS populates species cards here -->
          </div>
        </div>
      </section>
    </main>

    <!-- Detail Overlay — shown when a species card is clicked -->
    <div id="detail-overlay" class="detail-overlay">
      <div class="detail-panel" id="detail-panel">
        <button
          class="detail-close"
          id="detail-close"
          aria-label="Close detail view"
        >
          &times;
        </button>
        <div class="detail-preview" id="detail-preview"></div>
        <div class="detail-info" id="detail-info">
          <!-- JS populates detail content here -->
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="container">
        <p>BuddyDex &mdash; Made with curiosity</p>
      </div>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
